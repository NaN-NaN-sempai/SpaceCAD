<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="tempCursor"></div>

    <div class="fileIndicator">
        <button id="options">
            <i class="hamburger"></i>
        </button>
        <div class="fileList">

        </div>
    </div>

    <div class="bottomItens">
        <button id="setDefaultCamera">
            redefinir camera
        </button>

        <div class="btnList ignore">
            <button>posição</button>
            <button>orientação</button>
            <button>zoom</button>
            <button>perspectiva</button>
        </div>

        <button id="showEdges">mostrar cantos</button>
    
        <div id="logger" class="toggleable">
            <label class="buttonLike checkBoxButton hasUnread">
                registros
                <input type="checkbox">
                <div class="unread hide"></div>
            </label>
            <div class="body">
                <div class="title">Registros de Execução</div>
                <div class="list"></div>
            </div>
        </div>
    </div>

    <form modal id="renameModal" class="question">
        <div class="title">Renomear Arquivo</div>
        <p>Renomeando <span class="name"></span></p>
        <input type="text" name="name" placeholder="novo nome">
        <input type="hidden" name="path">
        <div class="buttons">
            <input type="button" class="cancel" value="cancelar" closemodal>
            <input type="submit" class="confirm" value="renomear">
        </div>
    </form>
</body>

<script>
    if(window.electronStoreAPI == undefined) {
        document.body.innerHTML = "";
        document.body.appendChild(createElement("div", e => {
            e.classList.add("question");
            e.style.margin = "auto";
            e.style.marginTop = "100px";
            e.innerText = "SpaceCAD App is not supported in this environment";
        }));
        document.body.style.backgroundColor = "var(--tertiary)";
        throw new Error("SpaceCAD App is not supported in this environment");
    }
</script>

<script src="/node_modules/acorn/dist/acorn.js"></script>
<script type="module"> // globalize astring 
    import JSHON from "lib/JSHON.js";
    window.JSHON = JSHON;

    import * as astring from "astring";
    window.astring = astring;

    import * as THREE from "three";
    import { Line2 } from 'three/addons/lines/Line2.js';
    import { LineGeometry } from 'three/addons/lines/LineGeometry.js';
    import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
    import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';
    import {RoomEnvironment} from "three/addons/environments/RoomEnvironment.js";
    window.THREE = {
        ...THREE,
        Line2,
        LineGeometry,
        LineMaterial,
        SVGLoader,
        RoomEnvironment
    };

    const loadScript = (...list) => {
        const src = list[0];

        if(src == undefined) return;
        const script = document.createElement("script");
        script.src = src;
        script.onload = () => {
            if(typeof list[1] == "function") {
                list[1]();
                list.splice(1, 1);
            }
            loadScript(...list.slice(1))
        };
        document.head.appendChild(script);
    }

    loadScript(
        "./scripts/lib/overloadOperator.js",
        "./scripts/lib/SpaceCAD.js", 
        "./scripts/engine.js", () => {
            const input = document.querySelector("#logger .checkBoxButton input");
            const domList = document.querySelector("#logger .list");
            const unread = document.querySelector("#logger .checkBoxButton .unread");

            input.checked = electronStore.logListState || false;
            
            logger.beforePush = (obj, list) => {
                if(input.checked)
                    obj.read = true;

                const unreadAmount = [...list, obj].filter(log => !log.read).length;
                unread.innerText = unreadAmount;
                unread.classList.toggle("hide", unreadAmount == 0);
                unread.dataset.lastType = obj.type;

                domList.scrollTop = domList.scrollHeight + 1000;

                return obj;
            }
            input.addEventListener("input", function(evt){
                const state = evt.target.checked;

                if(state)
                    logger.logList = logger.logList.map(log => ({...log, read: true}));

                electronStore.logListState = state;

                unread.classList.toggle("hide", true);
            });

            
            const resetCamera = document.querySelector("#setDefaultCamera")
            resetCamera.addEventListener("click", () => {
                cameraSetDefault();
            });

            const buttonList = [...resetCamera.parentElement.querySelector(".btnList").children];

            const fnList = [
                cameraSetDefaultPos,
                cameraSetDefaultRot,
                cameraSetDefaultZoom,
                cameraSetDefaultPerspective
            ];

            buttonList.forEach((el, index) => {
                el.closeMenu = true;
                
                el.addEventListener("click", (e) => {
                    e.stopPropagation();
                    fnList[index]();
                });
            });

            setupDropdown(resetCamera, "contextmenu", buttonList);

            const loggerDom = document.querySelector("#logger");
            
            setupDropdown(loggerDom, "contextmenu", [
                createElement("button", e => {
                    e.innerText = "limpar registros";
                    e.addEventListener("click", () => {
                        logger.clear();
                        unread.classList.toggle("hide", true);
                    });
                })
            ]);
        }
    );
</script>

<script> // FILE MANAGMENT
    const fileIndicator = document.querySelector(".fileIndicator");
    const fileList = fileIndicator.querySelector(".fileList");

    window.addEventListener("dragover", e => {
        e.preventDefault();
    });
    window.addEventListener("drop", event => {
        event.preventDefault();

        for(const [index, file] of [...event.dataTransfer.files].entries()){
            const path = window.electron.getFilePath(file);
    
            addPath(path, index == event.dataTransfer.files.length - 1);
        }
    });

    const electronStore = new Proxy({}, {
        get(_, key) {
            return window.electronStoreAPI.get(key);
        },

        set(_, key, value) {
            window.electronStoreAPI.set(key, value);
            return true;
        }
    });

    if(!electronStore.savedFiles)
        electronStore.savedFiles = [];

    const selectDOM = (fileDom, file) => {
        document.querySelector(".fileList .selected")?.classList.remove("selected");
        fileDom.classList.add("selected");
        document.title = `SpaceCAD - ${fileDom.innerText}`;

        electronStore.selectedFile = file;
        SpaceCAD.deleteAll();

        watchFile(file);
    }
    const fileDom = () => {
        // empty liekist
        fileList.innerHTML = "";

        fileArray.forEach((file) => {
            const fileDom = document.createElement("button");
            fileDom.classList.add("file");
            fileDom.innerText = file.name;
            fileDom.title = file.fullName+"\n"+file.path;
            fileDom.dataset.path = file.path;

            const x = document.createElement("button");
            x.classList.add("removeFile");
            
            x.addEventListener("click", (evt) => {
                evt.stopPropagation();
                removeFile(file, fileDom);
            });


            fileDom.appendChild(x);
            fileDom.addEventListener("click", () => selectDOM(fileDom, file));

            setupDropdown(fileDom, "contextmenu", [
                createElement("button", e => { e.innerText = "📄 abrir no editor";
                    e.closeMenu = true;
                    e.addEventListener("click", (evt) => {
                        evt.stopPropagation();

                        syncFetch("/openPath", {
                            method: "POST",
                            body: JSON.stringify({
                                path: file.path
                            })
                        })
                    });
                }),
                createElement("button", e => { e.innerText = "📝 renomear";
                    e.closeMenu = true;
                    e.addEventListener("click", (evt) => {
                        evt.stopPropagation();
                        renameModal.modal.data = file;
                        renameModal.modal.toggle();
                    });
                }),
                createElement("button", e => { 
                    e.innerText = "📂 abrir no explorador";
                    e.on("click", (evt) => {
                        evt.stopPropagation();
                        
                        syncFetch("/openPath", {
                            method: "POST",
                            body: JSON.stringify({
                                path: file.path,
                                directory: true
                            })
                        })
                    });
                    e.closeMenu = true;
                }),
            ]);
            fileList.appendChild(fileDom);
        });
    }


    const fileArray = electronStore.savedFiles;

    const fileIsInArray = (file) => {
        return fileArray.find((f) => 
            f.path == file.path
        );
    }
    const saveLS = () => {
        fileDom();
        electronStore.savedFiles = fileArray;
    }
    const addFile = (file, setSelected = false) => {
        if(fileIsInArray(file))
            return selectDOM(
                [...fileList.children]
                .find(el => el.dataset.path === file.path),
                file
            );

        fileArray.push(file);
        saveLS();

        if(setSelected){
            selectDOM(fileList.querySelector(".file"), file);
        }
    }

    const removeFile = (file, dom) => {
        if(dom.classList.contains("selected"))
            removeWatcher();
        
        fileArray.splice(fileArray.indexOf(file), 1);
        saveLS();
    }

    const editFile = (newFile) => {
        const oldFile = fileArray.find(f => f.path == newFile.oldPath);
        const el = [...fileList.children]
                .find(el => el.dataset.path === oldFile.path);

        delete newFile.oldPath;
        fileArray[fileArray.indexOf(oldFile)] = newFile;

        el.innerText = newFile.name;
        el.title = newFile.fullName+"\n"+newFile.path;
        el.dataset.path = newFile.path;

        saveLS();
    }

    fileDom();

    const watchFile = file => {
        const load = syncFetch("/watchFile", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                path: file.path
            })
        });

        SpaceCAD.run(load.text);
    }
    const removeWatcher = () => fetch("/removeWatcher");


    const fileInput = fileIndicator.querySelector("#options");


    const addPath = (path, setSelected = true) => {
        if(!path || !path.includes(".spacecad.js"))
            return console.error(`unsupported file type`);
        
        const fullName = path.split("\\").pop();
        const name = fullName.split(".spacecad")[0];

        const fileObject = {
            path,
            fullName,
            name
        };

        addFile(fileObject, 1);
    }
    fileInput.addEventListener("click", async () => {
        return;
        let path = await electron.openFile();

        addPath(path);
    });

    setupDropdown(fileIndicator.querySelector("#options"), [
        createElement("button", e => {
            e.innerHTML = "📁 abrir arquivo";
            e.addEventListener("click", async () => {
                let path = await electron.openFile();

                if(path) addPath(path);
            });
        }),
        createElement("button", e => {
            e.innerHTML = "📄 novo arquivo";
            e.addEventListener("click", async () => {
                alert("not implemented");
            });
        })
    ]);


    fileIndicator.querySelector("#options").on(["mouseenter", "mouseleave"], (evt, el) => {
        const type = evt.type;
        
        if(type == "mouseenter")
            Interval.timeout("hoverOptions", () => {
                el.dropdownOpen();
            }, 500)
        else
            Interval.clear("hoverOptions");
    })

    
    if(electronStore.selectedFile) {
        setTimeout(() => {
            watchFile(electronStore.selectedFile);
            selectDOM([...fileList.children].find(el => el.dataset.path === electronStore.selectedFile.path), electronStore.selectedFile);
        }, 250)
    }

    
    const renameModal = document.querySelector("#renameModal");
    renameModal.querySelectorAll("input[name]").on(["focus", "focusout"], (evt) => {
        const type = evt.type;
        inputManager.button.disabled = type == "focus";
    });
    renameModal.modal.onOpen(() => {
        const {data} = renameModal.modal;
        renameModal.query("span.name").innerText = data.name;
        renameModal.query('input[name="name"]').value = data.name;
        renameModal.query('input[name="name"]').focus();
        renameModal.query('input[name="path"]').value = data.path;
    });

    ObjectForm.on(renameModal, (form) => {
        const {name, path} = form.get();

        if(name == renameModal.modal.data.name) return alert("Nome igual ao anterior")
        if(!isValidFileName(name)) return alert("Nome inválido");
        
        syncFetch("/renameFile", {
            body: JSON.stringify({name, path})
        });

        renameModal.modal.close();
    });

    const serverEval = code => {
        fetch("/serverScope", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                code
            })
        }).then(res => res.text())
        .then(res => {
            console.log(res);
        });
    }
</script>



<script src="/socket.io/socket.io.js"></script>
<script> // SOCKET.IO
    const socket = io();
    
    let firstConnection = true;
    let doServerRestart = true;

    socket.on('connect', () => {
        if(!firstConnection && doServerRestart)
            location.reload();

        firstConnection = false;

        console.log('Connected to server');
    });


    socket.on("warn", (data) => {
        logger.warn(data);
    });
    socket.on("fileChanged", (data) => {
        SpaceCAD.run(data.content);
    });
    socket.on("fileRename", data => {
        const {
            newName,
            oldPath,
            newPath
        } = data;

        const file = {
            path: newPath,
            oldPath,
            name: newName.split(".spacecad")[0],
            fullName: newName
        };

        editFile(file);
    })

    socket.on('res', (data) => {
        logger.log('Received message:', data);
        return

        if(data == "server_restart"){
            location.reload();
        }
    });
</script>
