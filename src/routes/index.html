<script type="module"> // globalize astring 
    import JSHON from "lib/JSHON.js";
    window.JSHON = JSHON;

    import * as astring from "astring";
    window.astring = astring;

    import * as THREE from "three";
    import { Line2 } from 'three/addons/lines/Line2.js';
    import { LineGeometry } from 'three/addons/lines/LineGeometry.js';
    import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
    import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';
    import {RoomEnvironment} from "three/addons/environments/RoomEnvironment.js";
    window.THREE = {
        ...THREE,
        Line2,
        LineGeometry,
        LineMaterial,
        SVGLoader,
        RoomEnvironment
    };

    const loadScript = (...list) => {
        const src = list[0];

        if(src == undefined) return;
        const script = document.createElement("script");
        script.src = src;
        script.onload = () => {
            if(typeof list[1] == "function") {
                list[1]();
                list.splice(1, 1);
            }
            loadScript(...list.slice(1))
        };
        document.head.appendChild(script);
    }

    loadScript(
        "./scripts/lib/overloadOperator.js",
        "./scripts/lib/SpaceCAD.js", 
        "./scripts/engine.js", () => {
            const input = document.querySelector("#logger .checkBoxButton input");
            const domList = document.querySelector("#logger .list");
            const unread = document.querySelector("#logger .checkBoxButton .unread");

            input.checked = electronStore.logListState || false;
            
            logger.beforePush = (obj, list) => {
                if(input.checked)
                    obj.read = true;

                const unreadAmount = [...list, obj].filter(log => !log.read).length;
                unread.innerText = unreadAmount;
                unread.classList.toggle("hide", unreadAmount == 0);
                unread.dataset.lastType = obj.type;

                domList.scrollTop = domList.scrollHeight + 1000;

                return obj;
            }
            input.addEventListener("input", function(evt){
                const state = evt.target.checked;

                if(state)
                    logger.logList = logger.logList.map(log => ({...log, read: true}));

                electronStore.logListState = state;

                unread.classList.toggle("hide", true);
            });

            
            const resetCamera = document.querySelector("#setDefaultCamera")
            resetCamera.addEventListener("click", () => {
                cameraSetDefault();
            });

            const buttonList = [...resetCamera.parentElement.querySelector(".btnList").children];

            const fnList = [
                cameraSetDefaultPos,
                cameraSetDefaultRot,
                cameraSetDefaultZoom,
                cameraSetDefaultPerspective
            ];

            buttonList.forEach((el, index) => {
                el.closeMenu = true;
                
                el.addEventListener("click", (e) => {
                    e.stopPropagation();
                    fnList[index]();
                });
            });

            setupContextMenu(resetCamera, buttonList);

            const loggerDom = document.querySelector("#logger");
            
            setupContextMenu(loggerDom, [
                createElement("button", e => {
                    e.innerText = "limpar registros";
                    e.addEventListener("click", () => {
                        logger.clear();
                        unread.classList.toggle("hide", true);
                    });
                })
            ]);
        }
        );
</script>

<script> // FILE MANAGMENT
    const fileIndicator = document.querySelector(".fileIndicator");
    const fileInput = fileIndicator.querySelector("#openFile");
    const fileList = fileIndicator.querySelector(".fileList");

    window.addEventListener("dragover", e => {
        e.preventDefault();
    });
    window.addEventListener("drop", event => {
        event.preventDefault();

        for(const [index, file] of [...event.dataTransfer.files].entries()){
            const path = window.electron.getFilePath(file);
    
            addPath(path, index == event.dataTransfer.files.length - 1);
        }
    });

    const electronStore = new Proxy({}, {
        get(_, key) {
            return window.electronStoreAPI.get(key);
        },

        set(_, key, value) {
            window.electronStoreAPI.set(key, value);
            return true;
        }
    });

    if(!electronStore.savedFiles)
        electronStore.savedFiles = [];

    const selectDOM = (fileDom, file) => {
        document.querySelector(".fileList .selected")?.classList.remove("selected");
        fileDom.classList.add("selected");
        document.title = `SpaceCAD - ${fileDom.innerText}`;

        electronStore.selectedFile = file;
        SpaceCAD.deleteAll();

        watchFile(file);
    }
    const fileDom = () => {
        // empty liekist
        fileList.innerHTML = "";

        fileArray.forEach((file) => {
            const fileDom = document.createElement("button");
            fileDom.classList.add("file");
            fileDom.innerText = file.name;
            fileDom.title = file.fullName+"\n"+file.path;
            fileDom.dataset.path = file.path;

            const x = document.createElement("button");
            x.classList.add("removeFile");
            
            x.addEventListener("click", (evt) => {
                evt.stopPropagation();
                removeFile(file, fileDom);
            });

            
            const openInEditor = document.createElement("button");
            openInEditor.innerText = "abrir no editor";
            openInEditor.addEventListener("click", (evt) => {
                evt.stopPropagation();

                syncFetch("/openInEditor", {
                    method: "POST",
                    body: JSON.stringify({
                        path: file.path
                    })
                })
            });
            openInEditor.closeMenu = true;

            fileDom.appendChild(x);
            fileDom.addEventListener("click", () => selectDOM(fileDom, file));

            setupContextMenu(fileDom, [
                openInEditor,
            ]);
            fileList.appendChild(fileDom);
        });
    }


    const fileArray = electronStore.savedFiles;

    const fileIsInArray = (file) => {
        return fileArray.find((f) => 
            f.path == file.path
        );
    }
    const saveLS = () => {
        fileDom();
        electronStore.savedFiles = fileArray;
    }
    const addFile = (file, setSelected = false) => {
        if(fileIsInArray(file))
            return selectDOM(
                [...fileList.children]
                .find(el => el.dataset.path === file.path),
                file
            );

        fileArray.push(file);
        saveLS();

        if(setSelected){
            selectDOM(fileList.querySelector(".file"), file);
        }
    }

    const removeFile = (file, dom) => {
        if(dom.classList.contains("selected"))
            removeWatcher();
        
        fileArray.splice(fileArray.indexOf(file), 1);
        saveLS();
    }

    fileDom();

    const watchFile = file => {
        const load = syncFetch("/watchFile", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                path: file.path
            })
        });

        SpaceCAD.run(load.text);
    }
    const removeWatcher = () => fetch("/removeWatcher");




    const addPath = (path, setSelected = true) => {
        if(!path || !path.includes(".spacecad.js"))
            return console.error(`unsupported file type`);
        
        const fullName = path.split("\\").pop();
        const name = fullName.split(".spacecad")[0];

        const fileObject = {
            path,
            fullName,
            name
        };

        addFile(fileObject, 1);
    }
    fileInput.addEventListener("click", async () => {
        let path = await electron.openFile();

        addPath(path);
    });


    
    if(electronStore.selectedFile) {
        setTimeout(() => {
            watchFile(electronStore.selectedFile);
            selectDOM([...fileList.children].find(el => el.dataset.path === electronStore.selectedFile.path), electronStore.selectedFile);
        }, 250)
    }

    const serverEval = code => {
        fetch("/serverScope", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                code
            })
        }).then(res => res.text())
        .then(res => {
            console.log(res);
        });
    }
</script>



<script src="/socket.io/socket.io.js"></script>
<script> // SOCKET.IO
    const socket = io();
    
    let firstConnection = true;
    let doServerRestart = true;

    socket.on('connect', () => {
        if(!firstConnection && doServerRestart)
            location.reload();

        firstConnection = false;

        console.log('Connected to server');
    });


    socket.on("warn", (data) => {
        logger.warn(data);
    });
    socket.on("fileChanged", (data) => {
        SpaceCAD.run(data.content);
    });

    socket.on('res', (data) => {
        logger.log('Received message:', data);
        return

        if(data == "server_restart"){
            location.reload();
        }
    });
</script>
